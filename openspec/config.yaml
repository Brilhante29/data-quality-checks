schema: portfolio-system
references:
  - portfolio-reuse-kit
context: |
  Project: data-quality-checks (#26)
  Program: mlops-data-platform
  Claim: partition structurally trusted rows into accepted and reason-coded quarantine outputs, then score detection against independent truth.
  Downstream role: mlops-end2end (#21) consumes only validated data.
  Source of truth:
    - Use .portfolio/ as the synchronized reuse-kit snapshot.
    - Use project.yaml for the public project contract.
    - Use sdd/ for accepted decisions and release gates.
    - Use openspec/changes/ship-data-quality-checks for the active change.
rules:
  intent:
    - Measure invalid-row detection quality, not only fixture rejection prevalence.
  portfolio-impact:
    - Protect downstream training/analytics through artifacts and evidence, not source imports.
  architecture-record:
    - Challenge framework-owned policy, duplicated optimized semantics, and unnecessary platform components.
  component-pack:
    - Use mlops-data-platform, python-data-quality, and benchmark-harness guidance.
  reuse-delta:
    - Patch structural/quarantine/parity guidance into the kit; keep order rules and fixture local.
  benchmark-proof:
    - Preserve injected truth, multi-rule rows, input/output hashes, confusion, F1, rejected percentage, exact reasons, throughput, image, and failures.
    - Aggregate at least three same-image, same-signature runs with the shared harness.
  verification:
    - Verify structural fail-closed behavior, output accounting, oracle/Polars parity, Docker, no skipped adapter tests, raw JSON, summary, and CI.
